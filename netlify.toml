[build]
command = "pnpm run build"
publish = "dist"
environment = { NODE_VERSION = "22.22.0" }

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[edge_functions]]
path = "/api/*"
function = "request"

[[edge_functions]]
path = "/api/*"
function = "json"

[[edge_functions]]
path = "/api/*"
excludedPath = "/api/signin"
function = "session"

[[edge_functions]]
path = "/api/*"
function = "csrf"

[dev]
command = "vite"
port = 8888
